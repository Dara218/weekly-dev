<VirtualHost *:80>
    DocumentRoot "/var/www/weekly-dev/public/"
    ServerName weekly-dev

    ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://php:9000/var/www/weekly-dev/public/$1

    ErrorLog /dev/stdout
    CustomLog /dev/stdout combined
    RemoteIPHeader X-Forwarded-For

    <Directory "/var/www/weekly-dev/">
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
